[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sctgen"
version = "0.1.0"
description = "Synthetic CT Generation from MR/CBCT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # Already installed via conda

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "data*", "models*", "training*", "inference*", "utils*", "metrics*", "scripts*"]
