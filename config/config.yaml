  root: /data/home/sk1022/MajorProject_sCTGen/awesome-synthetic-CT-generation/bhuvanesh/datasets/bhuvaneshsingla/synthrad2025-hn/versions/3/Task1

data:
  modality: mr
  patch_size: null
  anatomy: HN
  num_adjacent_slices: "3d"
  cache_size: 1
  foreground_threshold: 0.3
  val_split: 0.2

dataloader:
  batch_size: 8
  num_workers_train: 4
  num_workers_val: 4
  prefetch_factor: 4

perf:
  deterministic: false
  cudnn_benchmark: true
  allow_tf32: true
  amp_dtype: bf16
  channels_last: true
  torch_compile: false
  torch_compile_mode: reduce-overhead
  ssim_downsample: 2

training:
  start: 1
  epochs: 1
  lr: 0.001
  lambda_ssim: 100.0
  lambda_sem: 0.1
  scheduler_patience: 10
  grad_clip: null
  sanity_steps: 1
  resume_path: null

checkpoint:
  ckpt_dir: checkpoints
  ckpt_filename: best.pth
  teacher_filename: frozen_teacher.pth

logging:
  log_images_every: 5
  save_vis_every: 5
  wandb_mode: online
  wandb_project: graceful-test
  wandb_run_name: test_unet3d_hn
  id_wandb: null
  resume_wandb: null
  loss_plot_name: "Loss Plot.png"
  visualisation_fig: "Batch_Output.png"

model3d:
  in_ch: 1
  out_ch: 1
  base_ch: 32
  stage_channels: [32, 64, 128, 256]
  blocks_per_stage: [2, 2, 2, 2]
  convs_per_block: 2
  negative_slope: 0.01

teacher_model:
  spatial_dims: 3
  in_channels: 1
  out_channels: 1
  channels: [32, 64, 128, 256, 512]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  norm: instance

inference:
  model_path: /data/home/sk1022/MajorProject_sCTGen/awesome-synthetic-CT-generation/bhuvanesh/runs/Unet3dHN/test_run/scripted.pth
  input_path: /data/home/sk1022/MajorProject_sCTGen/awesome-synthetic-CT-generation/bhuvanesh/datasets/bhuvaneshsingla/synthrad2025-hn/versions/3/Task1/1HNA001
  modality: mr
  patch_size: [32, 192, 160]
  stride: null
  output_dir: /data/home/sk1022/MajorProject_sCTGen/awesome-synthetic-CT-generation/bhuvanesh/inference/inference_outputs
  device: cuda
  num_adjacent_slices: "3d"
  channels_last: true
